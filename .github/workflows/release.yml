# GENERATED by tools/mirror-satellite.sh — edit there, not here.
# (This tree is force-pushed on every mirror run; hand edits are wiped.)
name: release

# Dispatch-only, ON PURPOSE. This repo rides the single Ryu release train, so it
# must never mint a tag of its own — you dispatch it AT the train tag:
#   gh workflow run release.yml --repo amajorai/shadow -f tag=vX.Y.Z
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach assets to (e.g. v0.0.16)'
        required: true

permissions:
  contents: write

jobs:
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Generate and publish DeepSeek V4.1 Flash release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODEL: deepseek-v4.1-flash
          OPENCODE_MAX_TOKENS: "16000"
          OPENCODE_SESSION_ID: "ryu-${{ github.repository }}-${{ github.run_id }}"
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving its AI notes unchanged."
            exit 0
          fi
          node scripts/rolling-notes.mjs --channel release --repo "$GITHUB_REPOSITORY" --require-ai > ai-notes.md
          {
            printf 'Built from commit `%s`.\n\n' "${GITHUB_SHA:0:7}"
            cat ai-notes.md
          } > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease=false --latest --notes-file release-notes.md
          else
            gh release create "$TAG" --latest --title "${GITHUB_REPOSITORY##*/} $TAG" --target "$GITHUB_SHA" --notes-file release-notes.md
          fi

  build:
    needs: notes
    name: ${{ matrix.plat }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            plat: linux-x86_64
            triple: ''
            ext: tar.gz
          - os: macos-latest
            plat: macos-aarch64
            triple: ''
            ext: tar.gz
          - os: macos-latest
            plat: macos-x86_64
            triple: x86_64-apple-darwin
            ext: tar.gz
          - os: windows-latest
            plat: windows-x86_64
            triple: ''
            ext: zip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Refuse to attach a binary built from a tree that is not the train tag's.
      # This workflow builds the satellite's default branch, which only matches the
      # tag after `tools/mirror-satellites.sh legacy` has run from that tag
      # (mirror-releases.yml does both, in that order). A stale tree would publish
      # the previous version under the new tag, and `releases/latest/download` would
      # hand it to every Core.
      - name: Verify the source is the train tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          have="$(sed -n 's/^version *= *"\(.*\)"/\1/p' apps/shadow/Cargo.toml | head -n 1)"
          if [ "v$have" != "$TAG" ]; then
            echo "::error::apps/shadow/Cargo.toml is version $have but the release tag is $TAG. Re-run tools/mirror-satellites.sh legacy from $TAG, then dispatch again."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # Must point at the manifest's own dir: with no root Cargo.toml the
          # action finds nothing at the repo root ("could not find Cargo.toml").
          workspaces: apps/shadow
          key: ${{ matrix.plat }}
      # Established by enumerating the -sys crates in the Linux dep graph
      # (alsa-sys via cpal, openssl-sys, dbus, opus). Never guard with `|| true`:
      # a missing dep must fail loudly at build time.
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev libopus-dev libasound2-dev
      - name: macOS build deps
        if: runner.os == 'macOS'
        run: brew install dbus pkg-config opus
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.triple }}" ]; then
            cargo build --release --manifest-path apps/shadow/Cargo.toml --target "${{ matrix.triple }}"
          else
            cargo build --release --manifest-path apps/shadow/Cargo.toml
          fi
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # A --target build lands under target/<triple>/release, not target/release.
          target="apps/shadow/target/release"
          if [ -n "${{ matrix.triple }}" ]; then target="apps/shadow/target/${{ matrix.triple }}/release"; fi
          out="dist/shadow-${{ matrix.plat }}.${{ matrix.ext }}"
          # The binary must land at the archive ROOT under its plain name —
          # Core's extract_from_tar_gz compares path.file_name() to "shadow"
          # exactly, and extract_from_zip matches a name ending "shadow.exe".
          case "${{ matrix.ext }}" in
            tar.gz)
              tar -czf "$out" -C "$target" "shadow"
              ;;
            zip)
              powershell -NoProfile -Command "Compress-Archive -Path '$target/shadow.exe' -DestinationPath '$out' -Force"
              ;;
          esac
          if [ ! -s "$out" ]; then
            echo "::error::failed to package $out — shadow would stay undownloadable."
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then sha="sha256sum"; else sha="shasum -a 256"; fi
          ( cd dist && for f in *; do case "$f" in *.sha256) ;; *) $sha "$f" > "$f.sha256";; esac; done )
      # gh release upload, NOT softprops: softprops PATCHes the release even when
      # only ADDING assets, and that PATCH is refused for the App token.
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no files matched" >&2; exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
